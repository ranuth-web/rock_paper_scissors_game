    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="10-rock-paper-scissor.css">
    </head>
    <body>
        <h2>Rock Paper Scissors</h2>
        <button onclick="playGame('rock')" class="move-botton"><img src="sticker/rock.png" class="move-icon"></button>
        <button onclick="playGame('paper')" class="move-botton"><img src="sticker/paper.png" class="move-icon" ></button>
        <button onclick="playGame('scissor');" class="move-botton"><img src="sticker/scissor.png" class="move-icon"></button>

        <p class="js-result result"></p>
        <p class="js-moves"></p>
        <p class="js-score score"> </p>

        <button onclick="
                score.wins = 0;
                score.losses = 0;
                score.ties = 0;
                updateScoreElement();
                localStorage.removeItem('score');
                " class="reset-score-botton">Reset Score</button>

        <div id="result"></div>
        <script src="10-rock-paper-scissor.js"></script>
    </body>
    </html>
